name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk harutodo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: HaruTodo Android APK
          files: harutodo.apk
          overwrite: true
