function parse(text,fallbackDate=''){let title=text.trim(),date=fallbackDate,time='',repeat='';const repeatWords=[['매일','daily'],['매주','weekly'],['매월','monthly'],['매달','monthly'],['매년','yearly']];for(const [w,r] of repeatWords){if(title.includes(w)){repeat=r;title=title.replace(w,' ');if(!date)date=dayKey(now);break}}const words=[['모레',2],['모래',2],['내일',1],['낼',1],['오늘',0],['글피',3]];for(const [w,n] of words){if(title.includes(w)){date=dayKey(moveDay(now,n));title=title.replace(w,' ');break}}const weekdays={'일요일':0,'월요일':1,'화요일':2,'수요일':3,'목요일':4,'금요일':5,'토요일':6,'일욜':0,'월욜':1,'화욜':2,'수욜':3,'목욜':4,'금욜':5,'토욜':6};for(const w of Object.keys(weekdays)){if(title.includes(w)){let n=(weekdays[w]-now.getDay()+7)%7;if(n===0)n=7;date=dayKey(moveDay(now,n));title=title.replace(w,' ');break}}const dm=title.match(/(?:(20\d{2})\s*[.\/-]\s*)?(\d{1,2})\s*(월|[.\/-])\s*(\d{1,2})\s*일?/);if(dm){const explicitYear=dm[1]?Number(dm[1]):null,m=Number(dm[2]),d=Number(dm[4]);let y=explicitYear||now.getFullYear(),candidate=new Date(y,m-1,d);if(m>=1&&m<=12&&d>=1&&d<=31&&candidate.getMonth()===m-1&&candidate.getDate()===d){if(!explicitYear&&candidate<now){y++;candidate=new Date(y,m-1,d)}date=dayKey(candidate);title=title.replace(dm[0],' ')}}else if(repeat==='monthly'){const dayOnly=title.match(/(\d{1,2})\s*일/);if(dayOnly){const d=Number(dayOnly[1]);if(d>=1&&d<=31){let candidate=new Date(now.getFullYear(),now.getMonth(),d);if(candidate<now)candidate=new Date(now.getFullYear(),now.getMonth()+1,d);date=dayKey(candidate);title=title.replace(dayOnly[0],' ')}}}const tm=title.match(/(오전|오후|아침|저녁)?\s*(\d{1,2})\s*(?:시(?:\s*(\d{1,2})\s*분?)?|:(\d{2}))/);if(tm){let h=Number(tm[2]),minute=Number(tm[3]||tm[4]||0);if(h<=23&&minute<=59){if(tm[1]==='오후'||tm[1]==='저녁'){if(h<12)h+=12}else if((tm[1]==='오전'||tm[1]==='아침')&&h===12)h=0;time=String(h%24).padStart(2,'0')+':'+String(minute).padStart(2,'0');title=title.replace(tm[0],' ')}}return {title:title.replace(/\s+/g,' ').trim(),date,time,repeat}}

async function googleApi(path,options={}){if(!googleAccessToken||Date.now()>=googleTokenExpires)throw new Error('Google 권한이 만료됐어요. 다시 연결을 눌러 주세요.');const response=await fetch('https://tasks.googleapis.com/tasks/v1/'+path,{...options,headers:{Authorization:'Bearer '+googleAccessToken,'Content-Type':'application/json',...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error?.message||('Google Tasks API 오류 ('+response.status+')'));return body}

function googleSnapshot(t){return JSON.stringify({title:t.title,description:t.description||'',date:t.date||'',repeat:t.repeat||'',done:!!t.done})}
function markerFor(id){return '[[haru-task:'+id+']]'}
function repeatMarker(r){return r?'[[haru-repeat:'+r+']]':''}
function repeatFromNotes(notes){const m=String(notes||'').match(/\[\[haru-repeat:([^\]]+)\]\]/);return m?m[1]:''}
function notesForTask(t){const markers=[markerFor(t.id),repeatMarker(t.repeat)].filter(Boolean).join(' ');return [markers,String(t.description||'').trim()].filter(Boolean).join('\n\n')}
